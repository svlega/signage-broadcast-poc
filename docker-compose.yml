name: signage-broadcast-poc

# Reverb, the queue worker, and the migrate job all reuse the exact same
# image as the web container (see backend/Dockerfile) — only `command`
# differs. That's fewer images to build and version, not a shortcut: all
# of these genuinely are "the Laravel app," just started in a different
# mode.
x-app-image: &app-image
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: runtime
  env_file: ./backend/.env.docker
  networks: [signage]

services:
  # One-shot: runs the migrations and exits. web/queue/reverb all start
  # at roughly the same moment and would otherwise race each other to
  # create the same `migrations` table against a cold database — a real
  # failure this setup hit during testing, not a hypothetical one.
  # Running it exactly once, here, and having the others wait on
  # `service_completed_successfully` is what fixes that.
  migrate:
    <<: *app-image
    # The official mysql image's own healthcheck can report "healthy"
    # during its one-time bootstrap (it briefly runs a temporary
    # internal server to create the schema/user, then restarts as the
    # real one) — a narrow window where `service_healthy` is already
    # true but the real server isn't accepting connections yet. A
    # bounded retry here is the standard, pragmatic fix; it only ever
    # actually loops on a fresh volume's first boot.
    # --seed here too, not just `migrate`: without it the schema exists
    # but the demo admin login and starter content never do, on a fresh
    # database. Both DatabaseSeeder and MediaItemSeeder are written to
    # be safe to run on every `docker compose up` (firstOrCreate / an
    # existence guard), not just the first one.
    command:
      [
        "sh", "-c",
        "for i in $$(seq 1 15); do php artisan migrate --force --seed && exit 0; sleep 2; done; exit 1",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    volumes:
      - storage:/var/www/html/storage

  reverb:
    <<: *app-image
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Published to the host so a browser (outside the compose network
      # entirely) can open the WebSocket directly — the one port on this
      # whole stack the browser talks to that isn't proxied through nginx.
      - "6001:6001"

  queue:
    <<: *app-image
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--sleep=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/var/www/html/storage

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: signage
      MYSQL_USER: signage
      MYSQL_PASSWORD: signage
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [signage]
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      # The MySQL service is named `mysql` below, not `db` — Compose
      # resolves container hostnames by service name over the shared
      # network, so this has to match exactly.
      PMA_HOST: mysql
      PMA_USER: root
      # Root's password specifically (MYSQL_ROOT_PASSWORD on the mysql
      # service below), not DB_PASSWORD — that's the app's `signage`
      # user, a different account than root. Hardcoded to match the
      # mysql service's own MYSQL_ROOT_PASSWORD rather than routed
      # through `${DB_PASSWORD}`, since env_file (used below by the app
      # containers) only injects vars *into* a container at runtime —
      # it never feeds Compose's own `${...}` substitution, which
      # resolves this YAML file before any container even starts.
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks: [signage]

  redis:
    image: redis:7-alpine
    networks: [signage]

networks:
  signage:

volumes:
  mysql-data:
  storage:
