; Production opcache: cache compiled bytecode across requests and never
; stat() the filesystem to check for changes — a signage backend's code
; doesn't change between deploys, so paying that check cost on every
; single request (the default, dev-friendly behavior) is pure waste.
; Deploys must restart php-fpm to pick up new code, which docker-compose
; already does on every `up` after a rebuild.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
