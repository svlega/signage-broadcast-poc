server {
    # Unprivileged port: the whole image runs as www-data (see Dockerfile),
    # never root, so nginx can't bind the standard port 80 itself — 8080
    # is what docker-compose actually publishes to the host anyway.
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    gzip on;
    gzip_types text/css application/javascript application/json;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
